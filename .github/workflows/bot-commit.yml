name: Bot commit
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Commit deploy marker to main (like cnh-starter deploy commit)
        run: |
          date -u +%FT%TZ > deploy-marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-marker.txt
          git commit -m "chore: deploy marker [skip ci]"
          git push origin HEAD:main
